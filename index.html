<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help The Earth - Charity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            margin: 20px;
            border: 1px solid #ccc;
        }
        .zigzag {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .zigzag div {
            width: 100%;
            margin: 10px 0;
            background: #f4f4f4;
            padding: 20px;
        }
        footer {
            background: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Help The Earth</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#statistics">Statistics</a>
            <a href="#competitions">Competitions</a>
            <a href="#volunteering">Volunteering</a>
        </nav>
    </header>

    <section id="home" class="zigzag">
        <div>Welcome to Help The Earth Charity!</div>
    </section>

    <section id="statistics" class="zigzag">
        <div>Statistics on Environmental Impact</div>
    </section>

    <section id="competitions" class="zigzag">
        <div>Join Our Competitions</div>
    </section>

    <section id="volunteering" class="zigzag">
        <div>Opportunities for Volunteering</div>
    </section>

    <footer>
        Contact us: info@helptheearth.org
    </footer>

    <script>
        // JavaScript can be added here for interactive features
    </script>
</body>
</html>
